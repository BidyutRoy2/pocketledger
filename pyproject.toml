[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketledger"
version = "0.1.0"
description = "Local-first personal finance ledger: import bank CSVs, auto-categorise, budgets, subscription audit, net worth — your money stays on your disk."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bidyut Roy", email = "bidyut@example.com" }]
keywords = [
    "personal-finance", "budget", "finance-tracker", "csv-import",
    "local-first", "privacy", "cli", "sqlite", "subscriptions",
    "net-worth", "expense-tracker", "money",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/BidyutRoy2/pocketledger"
Repository = "https://github.com/BidyutRoy2/pocketledger"
Issues = "https://github.com/BidyutRoy2/pocketledger/issues"

[project.scripts]
pocketledger = "pocketledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
